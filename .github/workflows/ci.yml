name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source-analysis dependencies
        run: python -m pip install -r requirements-source.txt
      - name: Whitespace check
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
      - name: Component boundaries
        run: python tools/check_components.py
      - name: Targeted pull request tests
        if: github.event_name == 'pull_request'
        run: python tools/run_tests.py --changed origin/${{ github.base_ref }}
      - name: Full integration suite
        if: github.event_name != 'pull_request'
        run: python tools/run_tests.py --all

  windows-process-tests:
    name: Windows process tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install source-analysis dependencies
        run: python -m pip install -r requirements-source.txt
      - name: Select Windows process tests
        id: selection
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $plan = python tools/run_tests.py --list --json --changed "origin/$env:BASE_REF"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $selected = (($plan | ConvertFrom-Json).components.PSObject.Properties.Name -contains 'process')
          } else {
            $selected = $true
          }
          "run=$($selected.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Bounded external-process tests
        if: steps.selection.outputs.run == 'true'
        run: python tools/run_tests.py --component process -j 1
