name: CI

on:
  # Pull requests test what changed. Main does not re-test: the publish gate
  # accepts the PR run when the merge commit has the PR head's exact tree.
  # Generated data only skips CI; the gate then uses the CI of the identical
  # code's first-parent ancestor. Keep these patterns in step with
  # publish_gate DATA_PREFIXES/DATA_FILES (test_foundation checks this).
  pull_request:
    paths:
      - "**"
      - "!availability/**"
      - "!curation/runs/**"
      - "!curation/latest.json"
      - "!external-links/**"
      - "!identity/latest.json"
      - "!identity/requests/**"
      - "!identity/runs/**"
      - "!identity/states/**"
      - "!publications/**"
      - "!releases/**"
      - "!snapshots/**"
      - "!workspace.lock.json"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source-analysis dependencies
        run: python -m pip install -r requirements-source.txt
      - name: Whitespace check
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
      - name: Component boundaries
        run: python tools/check_components.py
      - name: Targeted pull request tests
        if: github.event_name == 'pull_request'
        run: python tools/run_tests.py --changed origin/${{ github.base_ref }}
      - name: Full integration suite
        if: github.event_name != 'pull_request'
        run: python tools/run_tests.py --all

  windows-tests:
    name: Unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source-analysis dependencies
        run: python -m pip install -r requirements-source.txt
      - name: Targeted Windows pull request tests
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Production runs on Windows: PRs run the same affected tests here as on Ubuntu.
          python tools/run_tests.py --changed "origin/$env:BASE_REF"
      - name: Full integration suite
        if: github.event_name != 'pull_request'
        run: python tools/run_tests.py --all
